services:
  postgres:
    image: postgres:16-alpine
    container_name: startv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: startv
      POSTGRES_PASSWORD: startv_dev
      POSTGRES_DB: startv
    ports:
      - "5432:5432"
    volumes:
      - startv_postgres_data:/var/lib/postgresql/data

volumes:
  startv_postgres_data:
